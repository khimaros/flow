<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- background rounded square -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a"/>

  <!-- connection paths -->
  <path d="M14 16 C24 16, 20 28, 32 28" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M14 16 C22 20, 18 38, 26 44" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M32 28 C42 28, 38 16, 50 18" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M32 28 C40 30, 38 42, 50 44" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M26 44 C34 44, 38 44, 50 44" stroke="url(#g2)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- nodes - varied sizes for hierarchy -->
  <circle cx="14" cy="16" r="5.5" fill="url(#g1)"/>
  <circle cx="32" cy="28" r="7" fill="url(#g1)"/>
  <circle cx="50" cy="18" r="4.5" fill="url(#g1)"/>
  <circle cx="26" cy="44" r="4.5" fill="url(#g1)"/>
  <circle cx="50" cy="44" r="5.5" fill="url(#g1)"/>

  <!-- subtle highlights -->
  <circle cx="12.5" cy="14.5" r="2" fill="white" opacity="0.25"/>
  <circle cx="30" cy="26" r="2.5" fill="white" opacity="0.25"/>
  <circle cx="48.5" cy="16.5" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="24.5" cy="42.5" r="1.5" fill="white" opacity="0.25"/>
  <circle cx="48.5" cy="42.5" r="2" fill="white" opacity="0.25"/>
</svg>
