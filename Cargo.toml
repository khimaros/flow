[package]
name = "flow-rs"
version = "0.4.1"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
dotenvy = "0.15"
async-stream = "0.3"
async-trait = "0.1.89"
axum = { version = "0.8.7", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
glob = "0.3"
hex = "0.4.3"
mime_guess = "2.0.5"
reqwest = { version = "0.12.25", features = ["json", "blocking", "multipart"] }
rust-embed = "8.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1.17"
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
rhai = { version = "1.23.6", features = ["serde", "sync"] }
pyo3 = { version = "0.23", features = ["auto-initialize"], optional = true }
rand = "0.8"
url = "2.4"
uuid = { version = "1.0", features = ["v4"] }
boa_engine = { version = "0.19", optional = true }
libc = "0.2"
htmd = "0.1"
readability = { version = "0.3", default-features = false }
regex = "1.10"
scraper = "0.22"
tera = "1.20"

[features]
default = ["python", "typescript"]
python = ["dep:pyo3"]
lua = []
typescript = ["dep:boa_engine"]
