name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos:
    name: build macos (${{ matrix.arch }}, ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64]
        python: ['3.11', '3.12', '3.13', 'nopy']
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: actions/setup-python@v5
        if: matrix.python != 'nopy'
        with:
          python-version: ${{ matrix.python }}

      - name: install ui deps
        run: cd ui && npm ci

      - name: bundle
        run: |
          args="--platform darwin --arch ${{ matrix.arch }}"
          [ "${{ matrix.python }}" = "nopy" ] && args="$args --no-python"
          ./scripts/bundle-release.sh $args

      - uses: actions/upload-artifact@v4
        with:
          name: flow-macos-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/*.tgz

  build-linux:
    name: build linux (${{ matrix.arch }}, ${{ matrix.python }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.python == 'nopy' && 'debian:trixie' || format('python:{0}-trixie', matrix.python) }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        python: ['3.11', '3.12', '3.13', 'nopy']
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: install system deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl build-essential pkg-config git ca-certificates \
            libssl-dev nodejs npm

      - uses: actions/checkout@v4

      - name: mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@stable

      - name: install ui deps
        run: cd ui && npm ci

      - name: bundle
        run: |
          args="--platform linux --arch ${{ matrix.arch }}"
          [ "${{ matrix.python }}" = "nopy" ] && args="$args --no-python"
          ./scripts/bundle-release.sh $args

      - uses: actions/upload-artifact@v4
        with:
          name: flow-linux-${{ matrix.arch }}-${{ matrix.python }}
          path: dist/*.tgz

  publish:
    name: publish release
    needs: [build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
